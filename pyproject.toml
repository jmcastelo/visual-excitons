[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-excitons"
dynamic = ["version"]
description = "Visualization of excitonic properties computed with Yambo: dispersion, absorption, band structure and real-space wave functions"
readme = "README.md"
# The same license as YamboPy
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "jmcastelo", email = "jm.castelo@uv.es" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Development Status :: 3 - Alpha",
]
# Lower bounds: versions the code is known to work with
dependencies = [
    # Only the essential Qt modules (Core, Gui, Widgets, OpenGL, Svg, Test...): the
    # full PySide6 package adds about 400 MB of add-ons this program does not use
    # (WebEngine, PDF, 3D, charts...)
    "PySide6-Essentials>=6.8",
    # Dockable panels (Qt Advanced Docking System). Each release requires one
    # exact PySide6 version, which therefore sets the PySide6 installed
    "PySide6-QtAds>=5.1",
    "pyqtgraph>=0.14",
    "PyOpenGL>=3.1.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",   # publication figures of the 2D plots
    "netCDF4>=1.7",
    "psutil>=5.9",
    # The fork of YamboPy with the Brillouin-zone tools this program needs
    # (BrillouinZone, get_lattice_data); the official package lacks them
    "yambopy @ git+https://github.com/jmcastelo/yambopy.git@ase-bz",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4.4", "pytest-xdist>=3.5"]

[project.gui-scripts]
visual-excitons = "visual_excitons.main:main"

[project.urls]
Homepage = "https://github.com/jmcastelo/visual-excitons"
Documentation = "https://github.com/jmcastelo/visual-excitons/blob/main/docs/ARCHITECTURE.md"

[tool.setuptools.dynamic]
version = { attr = "visual_excitons.__version__" }

[tool.setuptools.packages.find]
include = ["visual_excitons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is imported from the repository root
pythonpath = ["."]
qt_api = "pyside6"
# Slow end-to-end tests run only on request: pytest -m slow.
# In parallel (pytest-xdist): workers chosen in tests/conftest.py so as not to
# saturate the CPU; tests grouped with xdist_group run in the same worker.
# Serial, e.g. to debug: pytest -n0
addopts = "-m 'not slow' -n auto --dist loadgroup"
markers = [
    "slow: long end-to-end calculations on real datasets (run with -m slow)",
    "data: needs the datasets in data/, which are not in the repository (skipped when missing)",
]
filterwarnings = [
    # Raised by yambopy and its dependencies, not by this project
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
